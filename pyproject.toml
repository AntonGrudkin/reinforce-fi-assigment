[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "market-sim"
version = "0.1.0"
description = "Minimal event-driven single-market backtesting simulator"
requires-python = ">=3.10"

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
plotting = ["matplotlib>=3.7"]
progress = ["tqdm>=4.66"]

[tool.setuptools.packages.find]
include = ["market_sim*"]
